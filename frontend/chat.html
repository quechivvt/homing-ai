<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Homing Chat</title>

</head>

<body>

    <!-- ================= Navbar ================= -->

    <header class="navbar">

        <div class="container">

            <a href="index.html"
               class="logo">

                <img src="/logo.svg"
                     alt="Homing">

                <span class="h3">

                    Homing

                </span>

            </a>

            <nav>

                <ul class="nav-links">

                     <li>

                        <button
                            type="button"
                            class="new-chat-btn"
                        >
                            New Chat
                        </button>

                    </li>


                    <li class="history-menu">

                        <button
                            type="button"
                            class="history-btn">

                            History

                        </button>

                        <div class="history-dropdown hidden">

                            <div class="history-list">

                                <!--
                                    JS render ở đây

                                    <div class="history-item">

                                        <button class="history-delete">
                                            ✕
                                        </button>

                                        <button class="history-title">
                                            Looking for Dog
                                        </button>

                                    </div>
                                -->

                            </div>

                        </div>

                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <!-- ================= Toolbar ================= -->

    <div class="chat-toolbar">

        <a href="index.html"
           class="back-link">

            ← Back to Landing

        </a>

    </div>

    <!-- ================= Chat ================= -->

    <main class="chat-page">

        <section class="chat-container">

            <div class="conversation">

                <!-- Chat.js render conversation -->

            </div>

            <form class="chat-input">

                <input
                    type="text"
                    placeholder="Ask me about any pet..."
                    autocomplete="off">

                <button type="submit">

                    Send

                </button>

            </form>

        </section>

    </main>

    <script
        type="module"
        src="/src/chat.js">

    </script>

</body>

</html>
