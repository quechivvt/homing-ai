version: "3.9"

services:

  frontend:
    build:
      context: ./frontend
    container_name: pet-frontend
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build:
      context: ./backend
    container_name: pet-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  redis:
    image: redis:8-alpine
    container_name: pet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
